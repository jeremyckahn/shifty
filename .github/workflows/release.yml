name: Release New Version

on:
  workflow_dispatch:
    inputs:
      releaseType:
        description: 'Release type'
        required: true
        default: 'patch'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Push the version commit and tag, and create the GitHub release.
      contents: write
      # Lets npm verify this run via OIDC for trusted publishing.
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.head_ref }}

      - name: Setup Git user
        uses: fregante/setup-git-user@v1

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Tag release
        run: npm version ${{ github.event.inputs.releaseType }}

        # Sets new package version as ${{ env.PACKAGE_VERSION }}
      - uses: jozsefsallai/node-package-version@v1.0.4

      # If running from main branch, this will trigger publish-docs.yml.
      - name: Update repo with tag commit
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tags: true
          branch: ${{ github.head_ref }}

      - name: Prepare build artifacts
        run: |
          npm run build
          zip shifty-${{ env.PACKAGE_VERSION }}.zip -r dist/*

      # Trusted publishing requires npm >= 11.5.1, which is newer than the npm
      # bundled with Node 22.
      - name: Upgrade npm
        run: npm install -g npm@latest

      # Authenticates via the trusted publisher configured for this package on
      # npmjs.com (workflow: release.yml). No NPM_TOKEN secret is needed.
      - name: Publish to NPM
        run: npm publish

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.PACKAGE_VERSION }}
          name: ${{ env.PACKAGE_VERSION }}
          draft: false
          prerelease: false
          files: |
            ./shifty-${{ env.PACKAGE_VERSION }}.zip
